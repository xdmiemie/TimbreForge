[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timbreforge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.50.1",
  "pydantic==2.10.6",
  "requests==2.34.2",
  "pycryptodome==3.23.0",
  "psutil==7.2.2",
  "numpy==2.2.6",
  "soundfile==0.13.1",
]

[tool.setuptools.packages.find]
where = ["backend"]
